apiVersion: 1
datasources:
  - name: Prometheus
    uid: netmon-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: PostgreSQL
    uid: netmon-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: netmon
    secureJsonData:
      password: ${PG_PASSWORD}
    jsonData:
      database: netmon
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
