# /etc/netmon/netmon.conf  -- this file is both a shell file (it can be sourced) and read by Python.
# KEY=VALUE only, no spaces around "=".

# ---------- measurement source ----------
SOURCE_NAME=            # name of this measurement machine, shown in Grafana/Telegram (e.g. laptop, pi-hanoi). Empty = hostname
UPLINKS=                # several networks on 1 machine: "<monN range>:<parent>" separated by spaces, e.g. "1-5:wlp1s0 6-10:usb0"
                        # the ISP name in the source key (e.g. laptop/vnpt) is detected with MaxMind ASN, no need to set it

# ---------- Globalping: measure from probes in many countries (no extra machine needed) ----------
GP_ENABLE=0             # 1 = netmon.service runs Globalping measurements periodically. Manual test: main.py --globalping
GP_LOCATIONS="JP SG KR IN DE GB US BR ZA AU"   # one probe per entry: country code, city, "AS45899", "VN+VNPT"...
GP_TARGETS=             # servers measured from Globalping: names or IPs from targets.csv, comma separated. Empty = all
GP_TYPE=mtr             # mtr (ping + route trace) | ping. Same cost: 1 test = 1 probe x 1 server
GP_PACKETS=10           # packets per measurement (1..16)
GP_INTERVAL=3600        # seconds between 2 rounds; stretched automatically above 250 tests/hour (500 with GP_TOKEN)

# ---------- sub-interfaces (ipvlan) ----------
PARENT=wlp1s0           # parent interface (Wi-Fi). Empty = use the interface of the default route
NAME_PREFIX=mon         # sub-interface names: mon1, mon2, ...
COUNT=10                # number of sub-interfaces when "subif create" is run without a number
IP_OFFSET=200           # IP of monN = <Wi-Fi network>.(IP_OFFSET+N). MUST be outside the router's DHCP pool
TABLE_BASE=100          # dedicated routing table of monN = TABLE_BASE + N
PARENT_CIDR=            # (optional) force the parent IP/prefix, e.g. 192.168.1.50/24. Empty = read automatically
GATEWAY=                # (optional) force the gateway. Empty = read from the default route

# ---------- measurement ----------
INTERVAL=60             # seconds between 2 measurement rounds
TRACE_EVERY=5           # periodic trace every TRACE_EVERY x INTERVAL seconds (5 x 60 = 5 minutes). Traces run in the
                        # background: probes do not wait for them
PING_COUNT=20           # fping packets per probe. With 5 packets, losing 1 is already 20% and jitter is very noisy
PING_PERIOD=1000        # ms between 2 fping packets (-p)
PING_TIMEOUT=1000       # ms to wait for each packet (-t). MUST be larger than the farthest RTT (~250 ms to the US/Brazil)
PROBE_PPS=50            # total ICMP packets/second of ALL monN together (0 = no limit). All monN leave for the Internet
                        # through 1 IP (NAT): sending too much at once makes the router / ISP rate-limit ICMP -> fake loss.
                        # Above this rate PING_PERIOD is stretched: 5 monN x 25 targets / 50 = 1 packet every 2.5 s per target
TRACE_TOOL=mtr          # mtr | traceroute
TRACE_CYCLES=5          # probes per hop (mtr -c / traceroute -q); the median is computed over these probes
TRACE_WORKERS=2         # background trace threads = mtr processes running at the same time. Traces run alongside the
                        # probes and share 1 public IP: too many -> routers rate-limit ICMP -> '*' hops and fake probe loss
TRACE_ROTATE=1          # 1 = in each periodic sweep, each server is traced through only 1 monN, rotating mon1 -> mon2 -> ...
                        # (all monN share the same Wi-Fi / ISP, so the route is the same): 24 traces per sweep instead of 5 x 24
RESULTS_DIR=/opt/netmon/results
STATE_DIR=/var/lib/netmon   # state.json: baselines + alert cooldowns (kept across restarts / --once)
TARGETS=/etc/netmon/targets.csv

# ---------- MaxMind (GeoLite2) ----------
GEOIP_CITY=/opt/netmon/data/GeoLite2-City.mmdb
GEOIP_ASN=/opt/netmon/data/GeoLite2-ASN.mmdb

# ---------- Prometheus / PostgreSQL ----------
EXPORTER_PORT=9108      # 0 = exporter disabled
PG_RETENTION_DAYS=30    # raw data (probe_result, trace_run, trace_hop) is kept N days
PG_LONG_RETENTION_DAYS=365   # hourly aggregates (probe_hourly) and alert history are kept N days

# ---------- Network Health: alerts for unstable connections (monitor/health.py) ----------
# Each round, each (monN, server) pair is compared with its OWN NORMAL LEVEL (baseline):
#   abnormal latency : median > min(LATENCY_WARN, baseline + max(LATENCY_RISE_MS, LATENCY_RISE_PCT% baseline))
#   abnormal jitter  : jitter > max(JITTER_WARN, JITTER_FACTOR x normal jitter)
#   abnormal loss    : loss > LOSS_UNSTABLE
#   1 metric -> DEGRADED, >= 2 metrics -> UNSTABLE, no reply -> DOWN, measurement error -> UNKNOWN (not counted)
# Cairo 250 ms: threshold = 250 + max(80, 40% x 250) = 350 ms. These are starting values; tune them to the real network.
LATENCY_WARN=600        # ms: absolute ceiling (also used before a baseline exists)
LATENCY_RISE_MS=80
LATENCY_RISE_PCT=40
JITTER_WARN=20          # ms
JITTER_FACTOR=2         # 0 = exceeding JITTER_WARN is enough
LOSS_UNSTABLE=5         # % loss considered abnormal (20 packets: >= 2 lost)
LOSS_WARN=20            # % loss considered far beyond the threshold (CRITICAL)
BASELINE_SAMPLES=30     # baseline computed over the last N NORMAL rounds (abnormal rounds are not learned)
BASELINE_MIN=5          # no baseline before N rounds (only LATENCY_WARN / JITTER_WARN apply)
BASELINE_RELEARN=21600  # seconds: an anomaly lasting longer than this becomes the new normal level and is learned
# Confirmation time and Telegram sending (1 combined message with latency + jitter + loss per route):
ALERT_HOLD=1200         # seconds: DEGRADED / UNSTABLE must last >= 20 minutes before a message is sent; a new route must
                        # stay stable >= 20 minutes before "route changed" is reported. 0 = report immediately
DOWN_HOLD=300           # seconds: DOWN is confirmed faster (5 minutes)
INSTABILITY_RATIO=0.5   # during an incident, >= 50% of the rounds must be abnormal (flapping connections still count)
CLEAR_SAMPLES=3         # 3 CONSECUTIVE normal rounds are needed to count as recovered (1 good round does not reset the count)
ALERT_GAP=300           # seconds: if data is missing longer than this, counting starts over (the incident is not continuous)
ALERT_ESCALATE=3600     # seconds: 1 abnormal metric lasting >= 1 hour is also CRITICAL
ALERT_COOLDOWN=1800     # seconds: while the incident lasts, remind after each interval; an escalation is sent at once
# Shared-path incident of 1 monN: many servers abnormal at once -> 1 PATH ISSUE message instead of N separate ones
PATH_MIN_TARGETS=3      # at least 3 servers ...
PATH_RATIO=0.3          # ... and >= 30% of the measured servers
GW_JITTER_WARN=10       # ms: gateway (Wi-Fi router) jitter above this -> suspect Wi-Fi / local network
GW_LOSS_WARN=5          # %: gateway loss above this -> suspect Wi-Fi / local network
LOSS_HOP_WARN=10        # % loss at the destination considered "real loss" for locating it (at which hop loss starts)
TRACE_ON_LOSS=1         # 1 = trace immediately when a probe sees loss, to locate it, without waiting for TRACE_EVERY
TRACE_ON_ANOMALY=1      # 1 = also trace immediately when a route is not HEALTHY (latency / jitter / loss / DOWN); the alert
                        # then includes an incident analysis: does the route differ from the usual one, at which hop loss starts

# ---------- Automation: systemd timer -> main.py --job <job> (monitor/jobs.py) ----------
# netmon-rollup (hourly), netmon-retention (03:30), netmon-backup (03:00), netmon-freshness (every 2 min), netmon-report (07:00)
FRESHNESS_MAX=180       # seconds: a running monN with no new measurement in PostgreSQL for longer than this -> DATA STALE alert
BACKUP_DIR=/var/backups/netmon   # where PostgreSQL backups are stored (pg_dump -Fc, restore with pg_restore)
BACKUP_KEEP_DAYS=7      # keep backups for N days
PG_CONTAINER=netmon-postgres-1   # name of the docker compose PostgreSQL container (sudo docker compose ps)
REPORT_DIR=/opt/netmon/results/reports   # daily report: netmon-report-<date>.txt (a short version is sent to Telegram)
